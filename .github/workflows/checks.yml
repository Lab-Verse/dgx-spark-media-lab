name: Offline package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg for real audio decode tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Syntax and package checks
        run: |
          bash -n scripts/setup_media.sh
          python scripts/check_package.py
      - name: Offline behavior tests
        run: python -m unittest discover -s tests -v
